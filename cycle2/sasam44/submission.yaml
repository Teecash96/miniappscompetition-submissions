builder_story: "I built NimHouse because I wanted games that are actually part
  of the wallet, not a logo bolted onto a webpage. The problem I'm solving: most
  mini-app \"games\" are either pay-to-play or games of chance, so I built the
  opposite , seven fully skill-based games where nothing can be bought and
  nothing can be won by luck. The wallet sits at the center: scores are signed
  by your key (tamper-proof), names are claimed with a signature, cheers are
  real NIM transactions carrying your own message on a public board, and every
  cup pool and payout is written to a public repo anyone can audit. Free to play
  is a promise, not a pricing tier , nobody pays a cent to compete, and only
  skill decides the podium."
