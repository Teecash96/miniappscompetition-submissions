builder_story: "I built Mimo because online communities are full of people but
  most digital events still feel one-way. \r

  \r

  Whether a community gathers through Discord, X, a creator group or a local
  organisation, participation is usually split across calls, polls, forms and
  separate tools.\r

  \r

  Mimo turns that gathering into one live experience. A host describes what they
  want, Mimo helps create it and then runs the room while people play, vote,
  respond and compete together.\r

  \r

  The larger mission is to help expand the Nimiq ecosystem by giving communities
  outside it a practical and enjoyable reason to enter Nimiq Pay. \r

  \r

  A host can fund a declared NIM reward before an event. Mimo verifies the real
  transaction, locks the rules when play begins and automatically pays eligible
  winners from the funded vault after the server confirms the results.\r

  \r

  Recurring events, community pages, seasons and standings make Mimo more than a
  one time campaign. \r

  \r

  It gives communities a reason to participate, discover Nimiq and keep
  returning."
