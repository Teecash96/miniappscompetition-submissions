builder_story: "I kept running into the same annoyance: paying several people in
  NIM meant repeating the same send flow over and over — open wallet, paste
  address, type amount, confirm. For team payouts or community rewards, it was
  slow and easy to mistype an address.\r

  \r

  So I built NimMultiSend: paste the whole list once, let the app validate every
  address and flag duplicates, review the totals, then approve each payment in
  Nimiq Pay. I deliberately made it non-custodial and sequential — the app never
  touches your funds, and every transaction gets its own approval and hash. I
  tested it end-to-end on testnet with a 10-recipient batch: all confirmed
  on-chain.\r

  \r

  My goal is simple: make paying many people in NIM as easy as paying one."
