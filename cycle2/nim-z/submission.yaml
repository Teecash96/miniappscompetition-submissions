builder_story: Gaming was my entry point into crypto, but most blockchain games
  feel like spreadsheets with skins. I wanted something different — a game where
  the crypto is invisible. You connect your wallet, you play, you earn. No
  staking pools, no tokenomics diagrams, just pure gameplay with real rewards.
  NIMZ started as an open-source zombie shooter called TheLastLight. I
  integrated Nimiq Pay so players can connect their wallet in one tap on mobile,
  pay 100 NIM to enter, and earn NIM for every zombie they take down. The whole
  experience — from wallet connection to earning rewards — happens inside the
  Nimiq ecosystem. I built this because I believe the best crypto apps are the
  ones where you forget you're using crypto.
