builder_story: "I built nimDay around a simple idea: birthdays should make
  gifting easier, not more complicated.\r

  \r

  Usually, if I want to get a friend something they actually want, I have to
  ask, guess, find a product link, or send money and hope they use it for
  something they like. For the person celebrating, sharing what they want can
  feel just as awkward.\r

  \r

  nimDay turns that into one simple experience: create a beautiful birthday
  card, add the things you actually want, and share one link with your friends.
  They can see your wishes, leave a birthday message, and send NIM directly to
  you when they want to contribute toward a gift.\r

  \r

  I wanted NIM to feel like part of a useful everyday experience rather than
  something people have to understand before they can use it. nimDay doesn't
  hold anyone's money or require a complicated crypto workflow—the gift goes
  directly from the giver's Nimiq wallet to the birthday person's wallet, while
  nimDay verifies the payment and updates the wish.\r

  \r

  The result is a birthday card, wishlist, and gifting experience in one place."
