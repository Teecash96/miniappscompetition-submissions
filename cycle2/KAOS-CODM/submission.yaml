builder_story: "I built NimCircle around a simple problem: shared savings are
  often coordinated through group chats, spreadsheets, screenshots, and manual
  payment tracking.\r

  \r

  I wanted to turn that informal process into a focused experience where the
  goal, contributors, progress, and payments all live in one Circle.\r

  \r

  Nimiq made that especially interesting because NIM transactions are fast and
  feeless, while Nimiq Pay provides the wallet experience directly inside the
  Mini App. Instead of treating wallet integration as a feature added to the
  side, I made the transaction itself part of NimCircle's core workflow.\r

  \r

  A major focus during development was making contributions verifiable.
  NimCircle does not simply trust the frontend after a transaction is submitted.
  The backend independently checks the transaction against the Circle's expected
  recipient, amount, memo, and contributor wallet before confirming it.\r

  \r

  I also wanted the app to feel approachable beyond a single demo flow, so I
  built Personal and Fundraising Circles, contribution history, Circle
  discovery, lifecycle management, localization, and a mobile-first interface.\r

  \r

  NimCircle is my attempt to make saving together with NIM feel simple,
  structured, and trustworthy."
