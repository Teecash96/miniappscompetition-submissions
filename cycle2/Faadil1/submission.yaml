builder_story: "Warm introductions often disappear after the first handoff.
  Someone says “I’ll pass it on,” but from that point there is no shared way to
  know who is carrying the introduction or whether it ever reached the intended
  person. I built NimCarry to make that human route visible without turning the
  relationship into a reward system. Each bridge explicitly chooses to
  participate, exactly 1 NIM acts as the custody baton, and only independently
  verified FINAL transactions can move the route forward. The goal is simple:
  make trusted introductions trackable while keeping the destination private and
  the human relationship at the center."
