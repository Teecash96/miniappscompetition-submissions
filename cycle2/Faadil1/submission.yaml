app_name: NimCarry
category: Social
tagline: One NIM. One bridge at a time.
description: NimCarry turns a warm introduction into a destination-bound human
  route you can actually follow. Each consenting bridge passes exactly 1 NIM as
  a custody baton, and the route advances only after independently verified
  FINAL.
