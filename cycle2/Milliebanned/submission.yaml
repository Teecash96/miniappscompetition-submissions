builder_story: Agora is the greek word for marketplace. During the the time of
  ancient Greece, Agora served as place where people came for all sort of
  things, it even served as safe haven from all household stress to some Greek
  men. So, i want Agora p2p platform to represent that, a place people can come
  and trust one another for all sort of transactions. Many web2 centralised p2p
  platforms encroach people with their rules and fees, so here, we are offering
  both decentralisation and trust.
